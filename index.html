<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Irfan Games - Page 1</title>
  <style>
    body {
      background-color: #1a1a1a;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 40px 20px;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 8px;
    }
    p.subtitle {
      color: #ccc;
      margin-bottom: 30px;
    }
    .games-grid {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      max-width: 900px;
      margin: 0 auto 40px auto;
    }
    .card {
      background-color: #2a2a2a;
      border-radius: 12px;
      padding: 25px 20px;
      width: 240px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .card-icon {
      font-size: 40px;
      margin-bottom: 10px;
    }
    .card h3 {
      margin: 10px 0 5px 0;
      font-size: 1.3rem;
    }
    .card p {
      color: #aaa;
      font-size: 0.9rem;
      margin-bottom: 15px;
    }
    .play-btn {
      display: inline-block;
      color: #00ffcc;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.1rem;
    }
    .play-btn:hover {
      text-decoration: underline;
    }
    .pagination {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 30px;
    }
    .page-btn {
      background-color: #333;
      color: #fff;
      padding: 10px 18px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
    }
    .page-btn.active {
      background-color: #6b21a8;
    }
    footer {
      margin-top: 40px;
      color: #888;
      font-size: 0.9rem;
    }
    footer a {
      color: #00ffcc;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <h1>Welcome to Irfan Games</h1>
  <p class="subtitle">Pick a game and play! (Page 1)</p>

  <div class="games-grid">
    <!-- Snake Card -->
    <div class="card">
      <div class="card-icon">🐍</div>
      <h3>Snake</h3>
      <p>Eat apples and grow</p>
      <a href="game3.html" class="play-btn">▶ Play</a>
    </div>

    <!-- Car Game Card -->
    <div class="card">
      <div class="card-icon">🏎️</div>
      <h3>Car Game</h3>
      <p>Drive and race</p>
      <a href="game2.html" class="play-btn">▶ Play</a>
    </div>

    <!-- Mini Warfare Card -->
    <div class="card">
      <div class="card-icon">🔫</div>
      <h3>Mini Warfare</h3>
      <p>Action shooter game</p>
      <a href="game4.html" class="play-btn">▶ Play</a>
    </div>
  </div>

  <!-- Page 1 & 2 Buttons -->
  <div class="pagination">
    <a href="index.html" class="page-btn active">1</a>
    <a href="page2.html" class="page-btn">2</a>
  </div>

  <footer>
    Mijn partner is <a href="https://Jimfun.com">Jimfun.com</a>
  </footer>

</body>
</html>
