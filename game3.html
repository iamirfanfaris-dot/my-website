<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Game - Irfan Games</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #1a1a1a;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    /* TOP NAVIGATION */
    .top-bar {
      padding: 15px 20px;
    }
    .back-btn {
      display: inline-block;
      border: 2px solid #00ffcc;
      color: #00ffcc;
      background: transparent;
      padding: 8px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
    }
    .back-btn:hover {
      background-color: #00ffcc;
      color: #1a1a1a;
    }

    /* CENTER AREA */
    .main-content {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* CLICK TO PLAY BUTTON */
    .click-to-play-btn {
      background: #000000;
      color: #ffffff;
      border: 2px solid #6b21a8;
      padding: 16px 36px;
      font-size: 22px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(107, 33, 168, 0.5);
    }
    .click-to-play-btn:hover {
      background: #6b21a8;
    }

    /* GAME CONTAINER */
    #gameCard {
      display: none;
      text-align: center;
      background: #0f172a;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #334155;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    canvas {
      background: #020617;
      border: 2px solid #a855f7;
      border-radius: 8px;
      display: block;
      margin: 10px auto;
    }
    .start-game-btn {
      background: #a855f7;
      color: #ffffff;
      border: none;
      padding: 10px 24px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
    }
    .start-game-btn:hover {
      background: #c084fc;
    }

    /* BOTTOM RIGHT FULLSCREEN BUTTON */
    .fullscreen-bar {
      position: fixed;
      bottom: 20px;
      right: 20px;
    }
    .fullscreen-btn {
      background: #000000;
      color: #ffffff;
      border: 2px solid #6b21a8;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
    .fullscreen-btn:hover {
      background: #6b21a8;
    }
  </style>
</head>
<body>

  <!-- TOP LEFT BACK BUTTON -->
  <div class="top-bar">
    <a href="page2.html" class="back-btn">&larr; Back to Page 2</a>
  </div>

  <!-- CENTER GAME AREA -->
  <div class="main-content" id="viewport">
    
    <!-- CLICK TO PLAY BUTTON -->
    <button class="click-to-play-btn" id="playBtn" onclick="launchGame()">CLICK TO PLAY</button>

    <!-- GAME CANVAS -->
    <div id="gameCard">
      <h3 style="margin-top: 0; color: #a855f7;">🚀 Space Defender</h3>
      <canvas id="spaceCanvas" width="300" height="400"></canvas>
      <p style="font-size: 13px; color: #94a3b8;">Use <b>Left & Right Arrows</b> to move, <b>Spacebar</b> to shoot!</p>
      <button class="start-game-btn" onclick="startSpaceGame()">Start Defender</button>
    </div>

  </div>

  <!-- BOTTOM RIGHT FULLSCREEN BUTTON -->
  <div class="fullscreen-bar">
    <button class="fullscreen-btn" onclick="toggleFullscreen()">FULLSCREEN</button>
  </div>

  <script>
    function launchGame() {
      document.getElementById("playBtn").style.display = "none";
      document.getElementById("gameCard").style.display = "block";
      startSpaceGame();
    }

    function toggleFullscreen() {
      const elem = document.getElementById("viewport");
      if (!document.fullscreenElement) {
        if (elem.requestFullscreen) elem.requestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    let gameLoop;
    function startSpaceGame() {
      const canvas = document.getElementById("spaceCanvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");

      let shipX = 135;
      let bullets = [];
      let enemies = [];
      let score = 0;
      let isGameOver = false;

      window.onkeydown = function(e) {
        if (e.key === "ArrowLeft" && shipX > 10) shipX -= 20;
        if (e.key === "ArrowRight" && shipX < 260) shipX += 20;
        if (e.key === " " || e.code === "Space") {
          bullets.push({ x: shipX + 12, y: 350 });
        }
      };

      if (gameLoop) clearInterval(gameLoop);

      gameLoop = setInterval(() => {
        if (isGameOver) return;

        ctx.fillStyle = "#020617";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Player Ship
        ctx.fillStyle = "#a855f7";
        ctx.fillRect(shipX, 360, 30, 20);

        // Bullets
        ctx.fillStyle = "#facc15";
        for (let b = bullets.length - 1; b >= 0; b--) {
          bullets[b].y -= 7;
          ctx.fillRect(bullets[b].x, bullets[b].y, 6, 12);
          if (bullets[b].y < 0) bullets.splice(b, 1);
        }

        // Spawn Enemies
        if (Math.random() < 0.04) {
          enemies.push({ x: Math.random() * 260, y: -20 });
        }

        // Enemies
        ctx.fillStyle = "#ef4444";
        for (let e = enemies.length - 1; e >= 0; e--) {
          enemies[e].y += 3;
          ctx.fillRect(enemies[e].x, enemies[e].y, 25, 25);

          // Check hit by bullet
          for (let b = bullets.length - 1; b >= 0; b--) {
            if (
              bullets[b] &&
              bullets[b].x > enemies[e].x &&
              bullets[b].x < enemies[e].x + 25 &&
              bullets[b].y > enemies[e].y &&
              bullets[b].y < enemies[e].y + 25
            ) {
              enemies.splice(e, 1);
              bullets.splice(b, 1);
              score += 20;
              break;
            }
          }

          if (enemies[e] && enemies[e].y > 360) {
            isGameOver = true;
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 22px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("GAME OVER", canvas.width / 2, 200);
            ctx.font = "14px sans-serif";
            ctx.fillText("Score: " + score, canvas.width / 2, 230);
            clearInterval(gameLoop);
          }
        }

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 14px sans-serif";
        ctx.textAlign = "left";
        ctx.fillText("Score: " + score, 15, 25);
      }, 30);
    }
  </script>
</body>
</html>
