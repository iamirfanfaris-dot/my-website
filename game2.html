<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Car Game - Irfan Games</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #1a1a1a;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    /* TOP NAVIGATION */
    .top-bar {
      padding: 15px 20px;
    }
    .back-btn {
      display: inline-block;
      border: 2px solid #00ffcc;
      color: #00ffcc;
      background: transparent;
      padding: 8px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
    }
    .back-btn:hover {
      background-color: #00ffcc;
      color: #1a1a1a;
    }

    /* CENTER AREA */
    .main-content {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* CLICK TO PLAY BUTTON */
    .click-to-play-btn {
      background: #000000;
      color: #ffffff;
      border: 2px solid #6b21a8;
      padding: 16px 36px;
      font-size: 22px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(107, 33, 168, 0.5);
    }
    .click-to-play-btn:hover {
      background: #6b21a8;
    }

    /* CAR GAME CONTAINER */
    #gameCard {
      display: none;
      text-align: center;
      background: #0f172a;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #334155;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    canvas {
      background: #1e293b;
      border: 2px solid #38bdf8;
      border-radius: 8px;
      display: block;
      margin: 10px auto;
    }
    .start-game-btn {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 10px 24px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
    }
    .start-game-btn:hover {
      background: #7dd3fc;
    }

    /* BOTTOM RIGHT FULLSCREEN BUTTON */
    .fullscreen-bar {
      position: fixed;
      bottom: 20px;
      right: 20px;
    }
    .fullscreen-btn {
      background: #000000;
      color: #ffffff;
      border: 2px solid #6b21a8;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
    .fullscreen-btn:hover {
      background: #6b21a8;
    }
  </style>
</head>
<body id="pageBody">

  <!-- TOP LEFT BACK BUTTON -->
  <div class="top-bar">
    <a href="index.html" class="back-btn">&larr; Back to Irfan Games</a>
  </div>

  <!-- CENTER GAME AREA -->
  <div class="main-content" id="viewport">
    
    <!-- CLICK TO PLAY BUTTON -->
    <button class="click-to-play-btn" id="playBtn" onclick="launchGame()">CLICK TO PLAY</button>

    <!-- STREET RACER GAME DISPLAY -->
    <div id="gameCard">
      <h3 style="margin-top: 0; color: #38bdf8;">🏎️ Street Racer</h3>
      <canvas id="streetRacerCanvas" width="300" height="400"></canvas>
      <p style="font-size: 13px; color: #94a3b8;">Use <b>Left & Right Arrow Keys</b> to steer!</p>
      <button class="start-game-btn" onclick="startStreetRacer()">Start Race</button>
    </div>

  </div>

  <!-- BOTTOM RIGHT FULLSCREEN BUTTON -->
  <div class="fullscreen-bar">
    <button class="fullscreen-btn" onclick="toggleFullscreen()">FULLSCREEN</button>
  </div>

  <script>
    function launchGame() {
      document.getElementById("playBtn").style.display = "none";
      document.getElementById("gameCard").style.display = "block";
      startStreetRacer();
    }

    function toggleFullscreen() {
      const elem = document.getElementById("viewport");
      if (!document.fullscreenElement) {
        if (elem.requestFullscreen) {
          elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    let racerLoop;
    function startStreetRacer() {
      const canvas = document.getElementById("streetRacerCanvas");
      const ctx = canvas.getContext("2d");

      let carX = 130;
      let obstacles = [];
      let score = 0;
      let isGameOver = false;

      window.onkeydown = function(e) {
        if (e.key === "ArrowLeft" && carX > 20) carX -= 30;
        if (e.key === "ArrowRight" && carX < 240) carX += 30;
      };

      if (racerLoop) clearInterval(racerLoop);

      racerLoop = setInterval(() => {
        if (isGameOver) return;

        ctx.fillStyle = "#1e293b";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = "#475569";
        ctx.setLineDash([15, 15]);
        ctx.beginPath();
        ctx.moveTo(100, 0); ctx.lineTo(100, 400);
        ctx.moveTo(200, 0); ctx.lineTo(200, 400);
        ctx.stroke();

        ctx.fillStyle = "#38bdf8";
        ctx.fillRect(carX, canvas.height - 70, 40, 60);

        if (Math.random() < 0.035) {
          let laneX = [20, 90, 160, 230][Math.floor(Math.random() * 4)];
          obstacles.push({ x: laneX, y: -60 });
        }

        ctx.fillStyle = "#f43f5e";
        for (let i = obstacles.length - 1; i >= 0; i--) {
          obstacles[i].y += 5;
          ctx.fillRect(obstacles[i].x, obstacles[i].y, 40, 60);

          if (
            obstacles[i].y > canvas.height - 120 &&
            obstacles[i].y < canvas.height - 10 &&
            Math.abs(obstacles[i].x - carX) < 30
          ) {
            isGameOver = true;
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 22px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("GAME OVER", canvas.width / 2, 200);
            ctx.font = "14px sans-serif";
            ctx.fillText("Final Score: " + score, canvas.width / 2, 230);
            clearInterval(racerLoop);
          }

          if (obstacles[i].y > canvas.height) {
            obstacles.splice(i, 1);
            score += 10;
          }
        }

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 14px sans-serif";
        ctx.textAlign = "left";
        ctx.fillText("Score: " + score, 15, 25);
      }, 30);
    }
  </script>
</body>
</html>
