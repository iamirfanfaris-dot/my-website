<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Irfan Games - Page 2</title>
  <link rel="icon" type="image/jpeg" href="logo.jpeg">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1a1a1a;
      color: white;
      text-align: center;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      min-height: 90vh;
    }
    header {
      margin-bottom: 30px;
    }
    .grid {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      flex: 1;
    }
    .card {
      background: #2a2a2a;
      border-radius: 10px;
      padding: 15px;
      width: 200px;
      text-decoration: none;
      color: white;
      transition: transform 0.2s, background 0.2s;
    }
    .card:hover {
      transform: translateY(-5px);
      background: #333;
    }
    .thumb {
      font-size: 50px;
      margin-bottom: 10px;
    }
    .play {
      color: #00ffcc;
      font-weight: bold;
    }
    .pagination {
      margin: 30px 0 10px 0;
    }
    .page-btn {
      display: inline-block;
      padding: 8px 14px;
      margin: 0 5px;
      background: #2a2a2a;
      color: white;
      border: 1px solid #444;
      border-radius: 5px;
      text-decoration: none;
      font-weight: bold;
    }
    .page-btn.active {
      background: #4a148c;
      border-color: #00ffcc;
    }
    .page-btn:hover {
      background: #333;
    }
    footer {
      margin-top: 20px;
      padding: 10px;
      color: #aaa;
      font-size: 14px;
    }
    footer a {
      color: #00ffcc;
      text-decoration: none;
      font-weight: bold;
    }
    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <header>
    <h1>Welcome to Irfan Games</h1>
    <p>Pick a game and play! (Page 2)</p>
  </header>

  <div class="grid">
    <!-- WAR THE KNIGHTS -->
    <a class="card" href="game4.html">
      <div class="thumb">⚔️</div>
      <div class="info">
        <h3>War the Knights</h3>
        <span>Medieval action game</span><br>
        <span class="play">▶ Play</span>
      </div>
    </a>

    <!-- GTA CITY -->
    <a class="card" href="game5.html">
      <div class="thumb">🏙️</div>
      <div class="info">
        <h3>GTA City</h3>
        <span>Open world action</span><br>
        <span class="play">▶ Play</span>
      </div>
    </a>
  </div>

  <div class="pagination">
    <a href="index.html" class="page-btn">1</a>
    <a href="page2.html" class="page-btn active">2</a>
  </div>

  <footer>
    Mijn partner is <a href="https://jimfun.com" target="_blank">Jimfun.com</a>
  </footer>

</body>
</html>
