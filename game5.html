<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTA City - Irfan Games</title>
  <style>
    body, html { 
      margin: 0; 
      padding: 0; 
      overflow: hidden; 
      height: 100%; 
      background-color: #1a1a1a;
      font-family: Arial, sans-serif;
    }
    #back-link {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 1003;
      color: #00ffcc;
      text-decoration: none;
      font-weight: bold;
      background: rgba(0,0,0,0.8);
      padding: 10px 15px;
      border-radius: 8px;
      border: 1px solid #00ffcc;
    }
    #back-link:hover {
      background: #00ffcc;
      color: #000;
    }
    #container {
      width: 100%;
      height: 100vh;
      position: relative;
    }
    .play-button { 
      padding: 20px 40px; 
      background: #000; 
      color: #fff; 
      border: 2px solid #4a148c; 
      border-radius: 10px; 
      font: bold 24px Arial; 
      cursor: pointer; 
      position: absolute; 
      top: 50%; 
      left: 50%; 
      transform: translate(-50%, -50%); 
      z-index: 1001; 
      transition: all 0.3s ease;
    }
    .play-button:hover { 
      background: #4a148c; 
      transform: translate(-50%, -50%) scale(1.05);
    }
    .fullscreen-button { 
      padding: 10px 15px; 
      background: #000; 
      color: #fff; 
      border: 2px solid #4a148c; 
      border-radius: 5px; 
      font: bold 14px Arial; 
      cursor: pointer; 
      position: fixed; 
      bottom: 20px; 
      right: 20px; 
      z-index: 1002; 
      transition: all 0.3s ease;
    }
    .fullscreen-button:hover { 
      background: #4a148c; 
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <!-- BACK TO HOME BUTTON -->
  <a id="back-link" href="index.html">← Back to Irfan Games</a>

  <!-- GAME CONTAINER -->
  <div id="container">
    <iframe id="fr" width="100%" height="100%" frameborder="0" allowfullscreen=""></iframe>
    <button class="play-button" type="button" onclick="PlayTo(this)">CLICK TO PLAY</button>
    <button class="fullscreen-button" type="button" onclick="openFullscreen()">FULLSCREEN</button>
  </div>

  <script>
    const DB_NAME = 'GameCacheDB';
    const STORE_NAME = 'GameFiles';
    const CACHE_DURATION = 90 * 24 * 60 * 60 * 1000;
    const FILE_URL = 'https://cdn.jsdelivr.net/gh/centerclassroom/mc55@main/gtaoo.xml';

    function openDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = (event) => {
          const db = event.target.result;
          db.createObjectStore(STORE_NAME, { keyPath: 'url' });
        };
        request.onsuccess = (event) => resolve(event.target.result);
        request.onerror = (event) => reject(event.target.error);
      });
    }

    async function saveToCache(url, content) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const transaction = db.transaction(STORE_NAME, 'readwrite');
        const store = transaction.objectStore(STORE_NAME);
        const request = store.put({ url: url, content: content, timestamp: Date.now() });
        request.onsuccess = () => resolve();
        request.onerror = () => reject(new Error('Cache error'));
      });
    }

    async function getFileFromCache(url) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const transaction = db.transaction(STORE_NAME, 'readonly');
        const store = transaction.objectStore(STORE_NAME);
        const request = store.get(url);
        request.onsuccess = async (event) => {
          const data = event.target.result;
          if (data && (Date.now() - data.timestamp) < CACHE_DURATION) {
            resolve(data.content);
          } else {
            try {
              const response = await fetch(url);
              const text = await response.text();
              await saveToCache(url, text);
              resolve(text);
            } catch (err) {
              reject(err);
            }
          }
        };
        request.onerror = () => reject(new Error('DB error'));
      });
    }

    function PlayTo(button) {
      const iframe = document.getElementById("fr");
      getFileFromCache(FILE_URL).then((text) => {
        iframe.contentDocument.open();
        iframe.contentDocument.write(text);
        iframe.contentDocument.close();
        iframe.style.display = "block";
        button.style.display = "none";
      }).catch((err) => {
        console.error('Error:', err);
        alert('Oyun yüklenemedi.');
      });
    }

    function openFullscreen() {
      getFileFromCache(FILE_URL).then((text) => {
        const newWindow = window.open("", "_blank");
        if (newWindow) {
          newWindow.document.open();
          newWindow.document.write(text);
          newWindow.document.close();
        } else {
          alert('Tam ekran açılamadı.');
        }
      }).catch((err) => {
        console.error('Error:', err);
        alert('Tam ekran yüklenemedi.');
      });
    }
  </script>
</body>
</html>
